name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history and tags to derive the version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # TheShed.Tests references Server, which references Client and Shared,
      # so this single command builds every project in the solution.
      - run: dotnet test TheShed.Tests/TheShed.Tests.csproj --nologo
